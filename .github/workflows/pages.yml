# Publishes the phone demo (browser-only, data stays on each device) to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Phone demo on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          EXPO_NO_TELEMETRY: '1'
      - run: npm run build:pages
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          BALAA_BASE_PATH: /${{ github.event.repository.name }}
          # Shared backend (apps-script/README.md): the owner's deployed web app. The
          # BALAA_BACKEND_URL repository variable overrides it; empty = data stays on each device.
          NEXT_PUBLIC_BALAA_BACKEND_URL: ${{ vars.BALAA_BACKEND_URL || 'https://script.google.com/macros/s/AKfycbxFl4vhbq_y71jnPvXvTzsG5eD5ex6x8BjuKWgTA4-RlHJBC26rmbUTAXxceqZVfUUhhQ/exec' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
