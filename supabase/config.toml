project_id = "balaa-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "8MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["balaa://auth/callback"]
jwt_expiry = 86400
enable_signup = true

enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.reports]
verify_jwt = true

[functions.mock-identity]
verify_jwt = true

[functions.test-notifications]
verify_jwt = true
